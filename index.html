<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Refleja tu Esencia</title>
    <meta name="description" content="Aura. Colección de ropa premium.">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="aura-background"></div>

    <header class="header">
        <div class="container header-container">
            <h1 class="logo">Aura.</h1>
            <span class="brand-badge">Premium Merch</span>
        </div>
    </header>

    
    <main>
        <section class="hero">
            <div class="container hero-container">
                <div class="hero-content">
                    <span class="brand-subtitle">The New Aura Collection</span>
                    <h2 class="hero-title">Refleja tu<br><span class="text-gradient">Verdadera Esencia</span></h2>
                    <p class="hero-description">Diseños exclusivos que vibran contigo. Únete a la lista de espera para nuestra próxima colección limitada y asegura tu pieza única.</p>
                </div>
                <div class="hero-form-wrapper">
                    <form id="contact-form" class="glass-form" novalidate>
                        <h3 class="form-title">Únete a la lista</h3>
                        
                        <div class="form-group">
                            <label for="name">Nombre Completo</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Tu nombre">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="subject">¿Qué buscas?</label>
                            <select id="subject" name="subject" class="form-control">
                                <option value="">Selecciona una opción...</option>
                                <option value="ropa">Ropa de temporada</option>
                                <option value="accesorios">Accesorios exclusivos</option>
                                <option value="colaboracion">Colaborar con Aura</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="message">Mensaje / Talla</label>
                            <textarea id="message" name="message" class="form-control" rows="3" placeholder="Cuéntanos más..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
